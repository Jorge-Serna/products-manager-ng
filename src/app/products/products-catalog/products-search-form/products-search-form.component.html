<form [formGroup]="searchProductsForm" (ngSubmit)="onSubmit()">
    <div class="row">

        <div class="col col-2">
            <label for="productId">ID</label>
            <input type="number" class="form-control form-control-sm" id="productId" name="productId" required autocomplete="off" formControlName="productId">
        </div>

        <div class="col col-4">
            <label for="nameProduct">Product</label>
            <input type="text" class="form-control form-control-sm" id="nameProduct" name="nameProduct" required autocomplete="off" formControlName="nameProduct">
        </div>

        <div class="col col-3">
            <label for="creationDate">Date of creation</label>
            <input type="date" class="form-control form-control-sm" id="creationDate" name="creationDate" required autocomplete="off" formControlName="creationDate">
        </div>

        <div class="col col-3">
            <label for="category">Category</label>
            <select name="category" id="category" class="form-control form-control-sm" formControlName="category">
                <option value="" selected>--Select--</option>
                <ng-container *ngFor="let cat of categories">
                    <option [attr.value]="cat.id">{{cat.catName}}</option>
                </ng-container>
            </select>
        </div>

        <div class="mt-3 d-flex">
            <button class="btn btn-primary btn-sm  me-2" type="submit">Search products</button>
            <button class="btn btn-danger btn-sm " type="button" (click)="resetForm()">Reset search</button>
        </div>
    </div>

</form>
